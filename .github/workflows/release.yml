name: Release

# A tag is the only trigger. The release is the tag: there is no button here
# that publishes something the repository does not already have a name for.
on:
  push:
    tags: ["v*"]

# These are the only jobs in this repository that write anything. CI stays
# read-only — creating the release object and attaching the bundles and their
# checksums to it is the whole list.
permissions:
  contents: write

# gh works out which repository to talk to by looking for a git directory,
# and the checksums job runs without one. The first release to carry that
# job spent its whole run failing on "not a git repository" for that reason
# alone. Name the repository once here instead of repeating a flag on every
# call that needs it.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: publish the tag as a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes come from the tag's own annotation, so the tag object has
          # to be fetched, not just the commit it points at.
          fetch-depth: 0
      # gh is preinstalled on the runner, so the token stays inside a first
      # party tool: no third-party action is handed a credential to create a
      # release with. The repository's own GITHUB_TOKEN expires with the job.
      - name: create the release from the tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # checkout leaves refs/tags/<tag> pointing straight at the commit, so
          # asking for the tag message here returns the commit message instead,
          # with nothing to say it did — which is what 1.0.1 published. Fetch
          # the tag object itself and refuse to continue if it is not one.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$(git rev-parse "$tag")")" != "tag" ]; then
            echo "::error::$tag is not an annotated tag; its notes would silently be the commit message" >&2
            exit 1
          fi
          notes="$(git tag -l --format='%(contents:body)' "$tag")"
          # A tag written as one line has a subject and no body; use it rather
          # than publishing a release with nothing in it.
          if [ -z "${notes// /}" ]; then
            notes="$(git tag -l --format='%(contents:subject)' "$tag")"
          fi
          # README tells the reader that every release states the commit it was
          # cut from, so that a moved tag is visible. Append it here rather than
          # trusting whoever writes the next annotation to remember.
          commit="$(git rev-parse "$tag^{commit}")"
          {
            printf '%s\n\n' "$notes"
            printf 'This release is commit %s.\n' "$commit"
            printf 'Checksums for every attached asset are in checksums-sha1.txt and checksums-md5.txt.\n'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            --title "AI3D ${tag#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  package:
    name: package ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-appimage
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - name: linux-arm64-appimage
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
          - name: macos-x64-dmg
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-arm64-dmg
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: windows-x64-nsis
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64-nsis
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: install stable Rust and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          (sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2) || true
      - run: npm ci
      - name: create a Windows self-signed code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AI3D, O=Mutantcat Working Group" `
            -KeyExportPolicy Exportable `
            -KeySpec Signature `
            -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddMonths(24)
          "AI3D_SIGNING_THUMBPRINT=$($cert.Thumbprint)" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: write the Tauri Windows signing config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @{
            bundle = @{
              windows = @{
                digestAlgorithm = "sha256"
                certificateThumbprint = $env:AI3D_SIGNING_THUMBPRINT
              }
            }
          } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8 "$env:RUNNER_TEMP/tauri-signing.json"
      - name: build the Windows NSIS bundle (self-signed)
        if: runner.os == 'Windows'
        run: npx tauri build --ci --bundles nsis --target "${{ matrix.target }}" --config "$env:RUNNER_TEMP/tauri-signing.json"
      - name: build the ${{ matrix.bundles }} bundle
        if: runner.os != 'Windows'
        run: npx tauri build --ci --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"
      - name: sign the Windows installer (self-signed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:AI3D_SIGNING_THUMBPRINT) { throw 'code-signing certificate setup did not run' }
          # The SDK ships signtool for every architecture in the same kit. Pick
          # the build that matches the runner: on an x64 runner the arm64 exe is
          # found first, and it refuses to start ("not a valid application").
          $arch = switch ($env:PROCESSOR_ARCHITECTURE) {
            'ARM64' { 'arm64'; break }
            'x86'   { 'x86'; break }
            default { 'x64' }
          }
          $kits = @(Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending)
          $signtool = $null
          foreach ($kit in $kits) {
            $candidate = Join-Path $kit.FullName "$arch\signtool.exe"
            if (Test-Path -LiteralPath $candidate) { $signtool = $candidate; break }
          }
          if (-not $signtool) {
            foreach ($kit in $kits) {
              $candidate = Get-ChildItem -Path $kit.FullName -Filter 'signtool.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) { $signtool = $candidate.FullName; break }
            }
          }
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          $installers = @(Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'no NSIS installer produced to sign' }
          foreach ($installer in $installers) {
            & $signtool sign /fd SHA256 /sha1 $env:AI3D_SIGNING_THUMBPRINT /d 'AI3D Installer' $installer.FullName
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -eq 'NotSigned') { throw "installer $($installer.Name) carries no signature" }
            Write-Host "installer signed: $($installer.Name)"
          }
      - name: verify the macOS dmg bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Tauri signs the .app ad-hoc while bundling and then removes the
          # loose copy once the dmg is written, so the shipped .app is only
          # reachable through the mounted image. Verify it there.
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          shopt -s nullglob
          dmgs=("$dmg_dir"/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::no dmg produced under $dmg_dir"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            # Check the image Tauri produced before touching it: signing rewrites
            # the file and would hide a broken checksum behind a valid seal.
            hdiutil verify "$dmg"
            codesign --force --sign - --timestamp=none "$dmg"
            codesign --verify --verbose=2 "$dmg"
            signature="$(codesign -dv "$dmg" 2>&1)"
            grep -q 'Signature=adhoc' <<< "$signature"
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
            if [ ! -L "$mount/Applications" ]; then
              echo "::error::$dmg has no /Applications shortcut"
              hdiutil detach "$mount"
              exit 1
            fi
            mounted_app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
            if [ -z "$mounted_app" ]; then
              echo "::error::$dmg contains no .app bundle"
              hdiutil detach "$mount"
              exit 1
            fi
            codesign --verify --deep --verbose=2 "$mounted_app"
            signature="$(codesign -dv "$mounted_app" 2>&1)"
            grep -q 'Signature=adhoc' <<< "$signature"
            exec_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$mounted_app/Contents/Info.plist")"
            file "$mounted_app/Contents/MacOS/$exec_name"
            hdiutil detach "$mount"
          done
      - name: attach the bundle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          roots=()
          for root in \
            "src-tauri/target/release/bundle" \
            "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$root" ]; then
              roots+=("$root")
            fi
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "::error::no bundle output directory was found"
            exit 1
          fi
          # Read line by line: the macOS runner ships bash 3.2, which has no
          # mapfile, and the step would fail with "command not found" there.
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(
            find "${roots[@]}" -maxdepth 2 -type f \
              \( -name "*.AppImage" -o -name "*.dmg" -o -name "*-setup.exe" \) |
              sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installable bundle was produced"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  # A release is only checkable if its reader can see what arrived. This runs
  # after every platform has finished and reads the assets back out of the
  # release the package jobs wrote, rather than trusting a path on one runner.
  checksums:
    name: attach checksums for the released assets
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: download the released assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          # Patterns, not everything: the two files this job itself writes live
          # on the release too, and a rerun must hash installers rather than its
          # own previous output.
          gh release download "$GITHUB_REF_NAME" \
            --dir "$RUNNER_TEMP/assets" \
            --pattern '*.AppImage' \
            --pattern '*.dmg' \
            --pattern '*-setup.exe'
      - name: write, verify and attach the checksum files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          # Read line by line: bash 3.2 has no mapfile.
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(
            find . -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
              -printf '%f\n' | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the release carries no assets to checksum"
            exit 1
          fi
          # Plain `sha1sum`/`md5sum` output, so the reader checks a download with
          # `sha1sum -c checksums-sha1.txt` and nothing has to be decoded first.
          sha1sum "${files[@]}" > checksums-sha1.txt
          md5sum "${files[@]}" > checksums-md5.txt
          # Prove the files a reader will run actually verify; a digest nobody
          # checked is the failure these files exist to prevent.
          sha1sum -c checksums-sha1.txt
          md5sum -c checksums-md5.txt
          gh release upload "$GITHUB_REF_NAME" \
            checksums-sha1.txt \
            checksums-md5.txt \
            --clobber
