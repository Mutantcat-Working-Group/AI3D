[package]
name = "ai3d-desktop"
version = "1.3.2"
description = "AI3D desktop client"
authors = ["Kelven Ling <kelvenlinglzy@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ai3d_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

